[package]
name = "taraskevizer-wasm"
version = "11.0.4"
edition = "2021"
description = "WASM bindings for taraskevizer"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
taraskevizer-core = { path = "../core" }
wasm-bindgen = "0.2"
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[lints]
workspace = true
