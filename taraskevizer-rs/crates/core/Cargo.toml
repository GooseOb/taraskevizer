[package]
name = "taraskevizer-core"
version = "11.0.0"
edition = "2021"
description = "Belarusian orthography converter (Narkamauka → Taraskevica)"

[dependencies]
regex = "1"
memchr = "2.8"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
fancy-regex = "0.14"
rayon = "1"

[lints]
workspace = true
