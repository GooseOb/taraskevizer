[package]
name = "taraskevizer-core"
version = "10.5.0"
edition = "2021"
description = "Belarusian orthography converter (Narkamauka → Taraskevica)"

[dependencies]
regex = "1"
aho-corasick = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
fancy-regex = "0.14"
rayon = "1"
