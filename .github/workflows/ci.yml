name: CI
on:
  push:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - run: bun i --frozen-lockfile
        env:
          HUSKY: 0
      - run: bun run build
      - run: bun run test
      - name: Smoke-test the npm launcher against the native CLI
        run: |
          HOST=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p dist/bin
          cp "taraskevizer-rs/target/debug/taraskevizer-cli" "dist/bin/tarask-$HOST"
          node dist/cli.js --no-color 'планета' | grep -q 'плянэта'
          echo 'планета' | node dist/cli.js --no-color | grep -q 'плянэта'
          node dist/cli.js --no-color -l 'планета' | grep -q 'planeta'
          node dist/cli.js --version | grep -q "$(jq -r .version package.json)"

  docs:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2

      - name: Install root dependencies
        run: bun i --frozen-lockfile
        env:
          HUSKY: 0

      - name: Install docs dependencies
        run: bun install --frozen-lockfile
        working-directory: website

      - name: Build docs site
        run: bun run build
        working-directory: website

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: "github-pages"
          path: "website/dist"

      - name: Deploy docs to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
