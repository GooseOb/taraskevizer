name: Publish
on:
  push:
    branches:
      - "main"

jobs:
  build:
    outputs:
      version_changed: ${{ steps.set_version.outputs.changed }}
      version: ${{ steps.set_version.outputs.value }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v2

      - run: bun i --frozen-lockfile
        env:
          HUSKY: 0
      - run: bun run build
      - run: bun run test
      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist
            README.md
            package.json
      - name: set output - version
        id: set_version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PKG_VERSION=$(jq -r .version package.json)
          LATEST_VERSION=$(npm view taraskevizer version)

          if [[ "$PKG_VERSION" != "$LATEST_VERSION" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
          echo "value=$PKG_VERSION" >> $GITHUB_OUTPUT

  json:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.version_changed == 'true'
    permissions:
      packages: write
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: Generate wordlist.json from the Rust core
        run: npm run json

      - name: Download latest release json bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p latest_json
          if gh release download --pattern "json.zip" --dir latest_json; then
            unzip -q latest_json/json.zip -d latest_json/unpacked
          else
            echo "NO_PREVIOUS_BUNDLE=true" >> $GITHUB_ENV
          fi

      - name: Compare json files
        run: |
          if [[ "$NO_PREVIOUS_BUNDLE" == "true" ]] || ! diff -r -q json/ latest_json/unpacked/; then
            echo "JSON_CHANGED=true" >> $GITHUB_ENV
          else
            echo "JSON_CHANGED=false" >> $GITHUB_ENV
          fi

      - name: Pack json.zip
        if: env.JSON_CHANGED == 'true'
        run: cd json && zip -X ../json.zip alphabets.json g.json noSoften.json softeners.json wordlist.json

      - name: Create Release
        if: env.JSON_CHANGED == 'true'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "json.zip"
          tag: v${{ needs.build.outputs.version }}

  docs:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - name: Install root dependencies
        run: bun i --frozen-lockfile
        env:
          HUSKY: 0

      - name: Install docs dependencies
        run: bun install --frozen-lockfile
        working-directory: website

      - name: Build docs site
        run: bun run build
        working-directory: website

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: "github-pages"
          path: "website/dist"

      - name: Deploy docs to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    if: needs.build.outputs.version_changed == 'true'
    steps:
      - uses: actions/setup-node@v6
        with:
          registry-url: "https://registry.npmjs.org"
          node-version: "24"

      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: .

      - run: npm publish

      - run: |
          curl -XPOST -u "${{secrets.PAT_USERNAME}}:${{secrets.PAT_TOKEN}}" -H "Accept: application/vnd.github.everest-preview+json" -H "Content-Type: application/json" https://api.github.com/repos/GooseOb/taraskevizatar/actions/workflows/build.yml/dispatches --data '{"ref": "main"}'
